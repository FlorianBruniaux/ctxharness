[[hooks.SessionStart]]
matcher = "^startup$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "./.codex/hooks/check.sh"

[[hooks.SessionStart.hooks]]
type = "command"
command = 42

[mcp_servers.safe]
url = "https://mcp.example.test"
bearer_token_env_var = "SAFE_MCP_TOKEN"

[mcp_servers.literal]
url = "https://mcp.example.test"
http_headers = { Authorization = "Bearer codex-secret-should-never-appear" }

[mcp_servers.fallback]
url = "https://mcp.example.test"
bearer_token_env_var = "${CODEX_TOKEN:-toml-fallback-should-never-appear}"

[mcp_servers.invalid_env_header]
url = "https://mcp.example.test"
env_http_headers = { Authorization = "codex-header-literal-should-never-appear" }
